[project]
name = "system-simulation"
version = "0.1.0"
description = "Executable learning models for understanding systems"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.38"]

[tool.setuptools.packages.find]
where = ["src"]
